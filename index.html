.logline{font-size:13px;padding:6px 0;border-bottom:1px solid #f3f3f5}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}

.rcpt{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px}
.rcpt label{display:flex;gap:7px;align-items:flex-start;font-size:13px;padding:4px}
.notice{background:var(--warnbg);color:#6b4500;border-radius:12px;padding:10px 12px;font-size:13px}
.notice.info{background:var(--infobg);color:#1f3f86}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:92vw}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}
/* public form */
.pub{max-width:560px;margin:0 auto;padding:18px}
.pubhead{background:var(--navy);color:#fff;border-radius:18px;padding:18px;margin-bottom:14px}
.pubhead h1{margin:6px 0 2px;font-size:22px}
.choice{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choice button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 6px;font-weight:700;color:var(--navy);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.choice button.on{border-color:var(--gold);background:#fffaf0}
.choice button span{font-size:24px}
@media(max-width:900px){.dash,.mgrid{grid-template-columns:1fr}}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr}.page{padding:12px}.item .right{display:none}.top{padding:8px 12px;gap:8px}.top .uname{display:none}.tabs{position:static}}
@media print{

  body.print-modal .modal{max-height:none;box-shadow:none;max-width:none;overflow:visible}
  .card,.item,.box{break-inside:avoid}
}
</style>

<script>
/* ============================================================
   delcFACILITIES — DELC Facility Management (single-file app)

   fac-send-email edge function. Public "report an issue" form at ?report

const CONFIG = {
  url: 'https://ksdxhqyusaylfpyeecbv.supabase.co',

  appKey: 'facilities',
  hubUrl: 'https://delcdata.github.io/DELCAppsHub/',
  bucket: 'fac-photos',
  fn: 'fac-send-email',
  fnKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzZHhocXl1c2F5bGZweWVlY2J2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NTE1NDgsImV4cCI6MjEwNDEyNzU0OH0.6HI0XWmlIfzyVy0iRH2GkAVNqYIZQwMeNhr4drTOUNo',   // public anon key (JWT) for the email function
  intake: 'office@mydelc.org',          // outside requests are emailed here for review & assignment
  intakeWho: 'Steph Benton'
};
const TYPES = {
  janitorial: {name:'Janitorial', icon:'🧹', color:'#00A3A3'},
  repair:     {name:'Repair',     icon:'🔧', color:'#2F80ED'},
  pm:         {name:'Preventive', icon:'🗓️', color:'#9B51E0'},
  project:    {name:'Project',    icon:'🎨', color:'#C8973A'},
  other:      {name:'Other',      icon:'📋', color:'#6b7280'}
};
const STATUS = {
  new:{name:'New', cls:'info'}, assigned:{name:'Assigned', cls:''}, in_progress:{name:'In progress', cls:'gold'},
  on_hold:{name:'On hold', cls:'gray'}, done:{name:'Done', cls:'ok'}, cancelled:{name:'Cancelled', cls:'gray'}
};
const PRIORITY = {low:{name:'Low', cls:'gray'}, normal:{name:'Normal', cls:''}, high:{name:'High', cls:'warn'}, urgent:{name:'Urgent', cls:'bad'}};
const KINDS = {staff:'Staff', volunteer:'Volunteer', committee:'Property committee', contractor:'Contractor / vendor'};
const UNITS = {day:'day', week:'week', month:'month', year:'year'};
const DEF_LOCATIONS = ['Sanctuary','Narthex','Social Hall','Family Life Center','Kitchen','Church Office','Pastor’s Study','Restrooms','Nursery','Classrooms','Basement / Mechanical','Roof','Parking Lot','Grounds','Whole building'];
const DEF_CATEGORIES = ['HVAC','Plumbing','Electrical','Fire & Safety','Appliances','Roof & Exterior','Grounds','Cleaning','Building'];
const TBL = {contacts:'fac_contacts', assets:'fac_assets', pm:'fac_pm', work:'fac_work', emails:'fac_emails'};

/* ---------------- state ---------------- */
const S = {
  user:null, userName:'', backend:'remote', loaded:false,
  contacts:[], assets:[], pm:[], work:[], emails:[], settings:{},
  view:'dash', wtype:'open', wstat:'open', q:'', modal:null, emailCfg:undefined
};

/* ---------------- utils ---------------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2));
const nowIso = () => new Date().toISOString();
const clone = o => JSON.parse(JSON.stringify(o));
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const money = n => '$' + (Math.round((+n || 0) * 100) / 100).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
const lsGet = (k, d=null) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const dOf = iso => { const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const daysFrom = iso => Math.round((dOf(iso) - dOf(today())) / 86400000);
const fmtD = iso => iso ? dOf(iso).toLocaleDateString([], {month:'short', day:'numeric', year: dOf(iso).getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined}) : '';
const fmtDT = iso => iso ? new Date(iso).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '';
function addInterval(iso, n, unit) {
  const d = dOf(iso || today()); n = Math.max(1, n | 0);
  if (unit === 'day') d.setDate(d.getDate() + n);
  else if (unit === 'week') d.setDate(d.getDate() + 7 * n);
  else if (unit === 'year') d.setFullYear(d.getFullYear() + n);
  else { const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); }
  return isoOf(d);
}
const every = p => `Every ${(p.every_n|0) > 1 ? p.every_n + ' ' + UNITS[p.every_unit] + 's' : UNITS[p.every_unit] || 'month'}`;
function toast(msg, kind='') {
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg;
  const box = $('#toast'); box.appendChild(el); while (box.children.length > 3) box.firstChild.remove(); setTimeout(() => el.remove(), kind === 'bad' ? 6000 : 3000);
}
const cn = id => S.contacts.find(c => c.id === id);
const asset = id => S.assets.find(a => a.id === id);
const pmOf = id => S.pm.find(p => p.id === id);
const wo = id => S.work.find(w => w.id === id);
const cname = id => { const c = cn(id); return c ? c.name + (c.company && c.kind === 'contractor' ? ' (' + c.company + ')' : '') : ''; };
const locations = () => (S.settings.locations && S.settings.locations.length) ? S.settings.locations : DEF_LOCATIONS;
const categories = () => (S.settings.categories && S.settings.categories.length) ? S.settings.categories : DEF_CATEGORIES;
const isOpen = w => !['done', 'cancelled'].includes(w.status);
const spent = w => (w.costs || []).reduce((a, c) => a + num(c.amount), 0);
const me = () => S.userName || S.user || 'Someone';

/* ---------------- photos: shrink before upload ---------------- */
async function shrink(file, max) {
  try {
    const bmp = await createImageBitmap(file, {imageOrientation: 'from-image'});
    const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    return blob || file;
  } catch (e) { return file; }
}
const blobToDataUrl = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });

/* ---------------- backends ---------------- */
const Local = {
  key: 'fac_demo_db',
  db() { const d = lsGet(this.key) || {}; ['contacts','assets','pm','work','emails'].forEach(k => d[k] = d[k] || []); d.settings = d.settings || {}; d.seq = d.seq || 1000; return d; },
  save(d) { try { localStorage.setItem(this.key, JSON.stringify(d)); } catch (e) { toast('Demo storage is full — remove some photos', 'bad'); } },
  async loadAll() { const d = this.db(); return {contacts:d.contacts, assets:d.assets, pm:d.pm, work:d.work, emails:d.emails.slice().reverse(), settings:d.settings}; },
  async upsert(kind, row) { const d = this.db(); if (kind === 'work' && !row.num) row.num = ++d.seq; const a = d[kind]; const i = a.findIndex(x => x.id === row.id); if (i >= 0) a[i] = row; else a.push(row); this.save(d); return row; },
  async remove(kind, id) { const d = this.db(); d[kind] = d[kind].filter(r => r.id !== id); this.save(d); },
  async saveSettings(data) { const d = this.db(); d.settings = data; this.save(d); },
  async upload(blob, path) { const small = await shrink(blob, 900); return {path, url: await blobToDataUrl(small)}; },
  async unupload() {},
  async fn(body) { if (body.mode === 'status') return {ok:true, provider:null}; return {ok:false, error:'not_configured'}; },
  subscribe() {}, unsubscribe() {}
};
const Remote = {
  sb: null, ch: null,
  init() { this.sb = window.supabase.createClient(CONFIG.url, CONFIG.key); },
  async q(p) { const {data, error} = await p; if (error) throw error; return data; },
  async loadAll() {
    const sel = t => this.q(this.sb.from(t).select('*'));
    const [contacts, assets, pm, work, emails, st] = await Promise.all([sel('fac_contacts'), sel('fac_assets'), sel('fac_pm'), sel('fac_work'),
      this.q(this.sb.from('fac_emails').select('*').order('created_at', {ascending:false}).limit(300)).catch(() => []),
      this.q(this.sb.from('fac_settings').select('data').eq('id', 'main').maybeSingle()).catch(() => null)]);
    return {contacts, assets, pm, work, emails, settings: (st && st.data) || {}};
  },
  async upsert(kind, row) {
    const r = {...row}; if (kind === 'work' && !r.num) delete r.num;
    const data = await this.q(this.sb.from(TBL[kind]).upsert(r).select().single());
    return data;
  },
  remove(kind, id) { return this.q(this.sb.from(TBL[kind]).delete().eq('id', id)); },
  saveSettings(data) { return this.q(this.sb.from('fac_settings').upsert({id:'main', data, updated_at: nowIso()})); },
  async upload(blob, path) {
    const small = await shrink(blob, 1600);
    const {error} = await this.sb.storage.from(CONFIG.bucket).upload(path, small, {contentType: small.type || 'image/jpeg', upsert: false});
    if (error) throw error;
    return {path, url: this.sb.storage.from(CONFIG.bucket).getPublicUrl(path).data.publicUrl};
  },
  async unupload(path) { if (path) await this.sb.storage.from(CONFIG.bucket).remove([path]).catch(() => {}); },
  async fn(body) {
    try {
      const r = await fetch(`${CONFIG.url}/functions/v1/${CONFIG.fn}`, {method:'POST', headers:{'Content-Type':'application/json', apikey: CONFIG.fnKey, Authorization: 'Bearer ' + CONFIG.fnKey}, body: JSON.stringify(body)});
      const j = await r.json().catch(() => ({ok:false, error:'Bad response (' + r.status + ')'}));
      if (r.status === 404) return {ok:false, error:'not_configured'};
      return j;
    } catch (e) { return {ok:false, error:'Could not reach the email service'}; }
  },
  subscribe(cb) {
    this.unsubscribe();
    const ch = this.sb.channel('fac-' + Math.random().toString(36).slice(2, 7));
    ['fac_work','fac_pm','fac_contacts','fac_assets'].forEach(t => ch.on('postgres_changes', {event:'*', schema:'public', table:t}, cb));
    ch.subscribe(); this.ch = ch;
  },
  unsubscribe() { if (this.ch) { this.sb.removeChannel(this.ch); this.ch = null; } }
};
let B = Remote;

/* ---------------- store ---------------- */
function arr(kind) { return S[kind]; }
async function save(kind, row, quiet) {
  row.updated_at = nowIso(); if (!row.created_at) row.created_at = row.updated_at;
  const a = arr(kind); const i = a.findIndex(r => r.id === row.id); if (i >= 0) a[i] = row; else a.push(row);
  try { const saved = await B.upsert(kind, row); if (saved) { const j = a.findIndex(r => r.id === row.id); if (j >= 0) a[j] = saved; return saved; } return row; }
  catch (e) { console.error(e); toast('Could not save: ' + (e.message || e), 'bad'); if (!quiet) reload(); throw e; }
}
async function del(kind, id) {
  const a = arr(kind); const i = a.findIndex(r => r.id === id); if (i >= 0) a.splice(i, 1);
  try { await B.remove(kind, id); } catch (e) { toast('Could not delete: ' + (e.message || e), 'bad'); reload(); }
}
async function saveSettings(patch) {
  S.settings = {...S.settings, ...patch};
  try { await B.saveSettings(S.settings); } catch (e) { toast('Could not save settings: ' + (e.message || e), 'bad'); }
}
async function reload() {
  try { const d = await B.loadAll(); Object.assign(S, d); S.loaded = true; } catch (e) { console.error(e); toast('Could not load data: ' + (e.message || e), 'bad'); }
  renderApp();
}
let rt = null; function remoteChanged() { clearTimeout(rt); rt = setTimeout(reload, 600); }

/* ---------------- derived ---------------- */
function pmState(p) {
  if (!p.active) return {cls:'gray', txt:'Paused', rank:9};
  if (!p.next_due) return {cls:'gray', txt:'No date', rank:8};
  const d = daysFrom(p.next_due);
  if (d < 0) return {cls:'bad', txt:`Overdue ${-d} day${d === -1 ? '' : 's'}`, rank:0, d};
  if (d === 0) return {cls:'bad', txt:'Due today', rank:1, d};
  if (d <= Math.max(7, p.remind_days || 7)) return {cls:'warn', txt:`Due in ${d} day${d === 1 ? '' : 's'}`, rank:2, d};
  return {cls:'', txt:'Due ' + fmtD(p.next_due), rank:3, d};
}
const openPmWork = p => S.work.find(w => w.pm_id === p.id && isOpen(w));
function workSort(a, b) {
  const pr = {urgent:0, high:1, normal:2, low:3}; const st = {new:0, assigned:1, in_progress:1, on_hold:2, done:3, cancelled:4};
  return (st[a.status] ?? 5) - (st[b.status] ?? 5) || (pr[a.priority] ?? 2) - (pr[b.priority] ?? 2) || String(a.due_date || '9999').localeCompare(String(b.due_date || '9999')) || (b.num || 0) - (a.num || 0);
}
function yearSpend(y) { y = String(y || new Date().getFullYear()); return S.work.reduce((a, w) => a + (w.costs || []).filter(c => String(c.date || '').startsWith(y)).reduce((s, c) => s + num(c.amount), 0), 0); }

/* ---------------- shared bits ---------------- */
const typeChip = t => { const x = TYPES[t] || TYPES.other; return `<span class="chip" style="background:${x.color}1f;color:${x.color}">${x.icon} ${x.name}</span>`; };
const statusChip = s => `<span class="chip ${(STATUS[s] || {}).cls || ''}">${esc((STATUS[s] || {name:s}).name)}</span>`;
const prioChip = p => p && p !== 'normal' ? `<span class="chip ${PRIORITY[p].cls}">${PRIORITY[p].name}</span>` : '';
function dueChip(w) {
  if (!w.due_date || !isOpen(w)) return '';
  const d = daysFrom(w.due_date);
  return `<span class="chip ${d < 0 ? 'bad' : d <= 3 ? 'warn' : 'gray'}">${d < 0 ? 'Overdue' : d === 0 ? 'Due today' : 'Due ' + fmtD(w.due_date)}</span>`;
}
function workItem(w) {
  const ph = (w.photos || [])[0];
  const meta = [statusChip(w.status), prioChip(w.priority), dueChip(w), w.location ? `<span>📍 ${esc(w.location)}</span>` : '', w.assignee_id ? `<span>👤 ${esc(cname(w.assignee_id))}</span>` : (isOpen(w) ? '<span style="color:var(--warn)">Unassigned</span>' : ''), w.source === 'public' ? '<span class="chip info">From form</span>' : ''].filter(Boolean).join('');
  return `<div class="item" data-act="openWork" data-id="${w.id}"><div class="ic" style="background:${(TYPES[w.type] || TYPES.other).color}1a">${(TYPES[w.type] || TYPES.other).icon}</div>
    <div class="main"><div class="t">#${w.num || '—'} · ${esc(w.title || 'Untitled')}</div><div class="s">${meta}</div></div>
    ${ph ? `<img class="thumb" src="${esc(ph.url)}" alt="">` : ''}<div class="right tiny muted">${fmtD((w.created_at || '').slice(0, 10))}${spent(w) ? '<br>' + money(spent(w)) : ''}</div></div>`;
}
function pmItem(p) {
  const st = pmState(p); const a = asset(p.asset_id); const ow = openPmWork(p);
  return `<div class="item" data-act="openPm" data-id="${p.id}"><div class="ic" style="background:#9B51E01a">🗓️</div>
    <div class="main"><div class="t">${esc(p.title)}</div><div class="s"><span class="chip ${st.cls}">${st.txt}</span><span>${every(p)}</span>${a ? `<span>⚙️ ${esc(a.name)}</span>` : p.location ? `<span>📍 ${esc(p.location)}</span>` : ''}${p.assignee_id ? `<span>👤 ${esc(cname(p.assignee_id))}</span>` : ''}${ow ? `<span class="chip info">Work order #${ow.num} open</span>` : ''}</div></div>
    <div class="right">${ow ? `<button class="btn xs" data-act="openWork" data-id="${ow.id}">Open #${ow.num}</button>` : `<button class="btn xs" data-act="pmToWork" data-id="${p.id}">Create work order</button>`}<button class="btn xs ok" data-act="pmDone" data-id="${p.id}">Mark done</button></div></div>`;
}
function contactOptions(sel, blank = '— unassigned —') {
  const groups = Object.entries(KINDS).map(([k, n]) => { const cs = S.contacts.filter(c => c.active !== false && (c.kind || 'volunteer') === k).sort((a, b) => a.name.localeCompare(b.name)); return cs.length ? `<optgroup label="${n}">${cs.map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}${c.company ? ' — ' + esc(c.company) : ''}</option>`).join('')}</optgroup>` : ''; }).join('');
  const gone = sel && !S.contacts.some(c => c.id === sel && c.active !== false) && cn(sel) ? `<option value="${sel}" selected>${esc(cn(sel).name)} (inactive)</option>` : '';
  return `<option value="">${blank}</option>${gone}${groups}`;
}
const locList = () => `<datalist id="locs">${locations().map(l => `<option value="${esc(l)}">`).join('')}</datalist>`;
const catList = () => `<datalist id="cats">${categories().map(l => `<option value="${esc(l)}">`).join('')}</datalist>`;

function advancePm(pmId, doneIso) {

async function saveWork(markDone) {
  grab(); const r = S.modal.row; const prev = wo(r.id);
  if (!r.title) { toast('Give it a short title first', 'bad'); return; }
  if (markDone) r.status = 'done';
  if (r.status === 'new' && r.assignee_id && (!prev || prev.status === 'new')) r.status = 'assigned';
  const log = r.log = r.log || [];
  if (!prev) log.push({at: nowIso(), by: me(), text: 'Created'});
  else {
    if (prev.status !== r.status) log.push({at: nowIso(), by: me(), text: 'Status: ' + (STATUS[prev.status] || {}).name + ' → ' + (STATUS[r.status] || {}).name});
    if (prev.assignee_id !== r.assignee_id) log.push({at: nowIso(), by: me(), text: r.assignee_id ? 'Assigned to ' + cname(r.assignee_id) : 'Unassigned'});

  if (r.status !== 'done') r.done_at = null;

  let msg = prev ? 'Saved' : `Created #${saved.num || ''}`;
  if (saved.status === 'done' && (!prev || prev.status !== 'done') && saved.pm_id) { const nx = advancePm(saved.pm_id, today()); if (nx) msg += ` · next due ${fmtD(nx)}`; }

}

    const bid = $('#tb_body').value; const bname = (bodies.find(b => b.id === bid) || {}).name || 'Council';
    const ask = $('#tb_ask').value.trim(); const summary = [$('#tb_sum').value.trim(), ask ? 'Request: ' + ask : ''].filter(Boolean).join('\n');
    const row = {id: uid(), body_id: bid, section: $('#tb_sec').value, title: `#${w.num || ''} ${w.title || 'Facilities request'}`.trim(), summary, link: 'https://delcdata.github.io/delcFACILITIES/?wo=' + encodeURIComponent(w.id), source: 'facilities', source_id: String(w.id), submitted_by: me(), status: 'pending', created_at: nowIso(), updated_at: nowIso()};
    const btn = $('[data-act=toBoardSend]'); btn.disabled = true; btn.textContent = 'Sending…';
    try {
      if (S.backend === 'remote') { const r = await B.sb.from('board_inbox').insert(row); if (r.error) throw r.error; }

    S.modal = m.back; (S.modal.row.log = S.modal.row.log || []).push({at: nowIso(), by: me(), text: `Sent to ${bname} agenda (delcBOARD inbox)`}); await commitSub();
    toast(`Sent to the ${bname} agenda inbox`, 'ok');
  },
  bgClose(d, e) { if (e.target.classList.contains('modal-bg')) { S.modal = null; renderModal(); } },
  zoom(d) { const ps = (S.modal.row.photos || []); const p = ps[+d.i]; if (!p) return; $('#lightbox').innerHTML = `<div class="lightbox" onclick="this.remove()"><img src="${esc(p.url)}" alt=""></div>`; },
  newWork(d) { const t = d.type || 'repair'; S.modal = {type:'work', row: newWorkRow(t, d.asset ? {asset_id: d.asset, location: (asset(d.asset) || {}).location || ''} : null)}; renderModal(); setTimeout(() => { const el = $('#modal [data-f=title]'); el && el.focus(); }, 40); },

  printWork() { grab(); renderModal(); document.body.classList.add('print-modal'); setTimeout(() => { window.print(); document.body.classList.remove('print-modal'); }, 60); },
  ckAdd() { const el = $('#ck_new'); const t = (el.value || '').trim(); if (!t) return; grab(); (S.modal.row.checklist = S.modal.row.checklist || []).push({text: t, done: false}); commitSub().then(() => { const n = $('#ck_new'); n && n.focus(); }); },
  ckDel(d) { grab(); S.modal.row.checklist.splice(+d.i, 1); commitSub(); },
  costAdd() { const amt = num($('#cost_amt').value); if (!amt) { toast('Enter an amount', 'bad'); return; } grab();
    (S.modal.row.costs = S.modal.row.costs || []).push({id: uid(), desc: $('#cost_desc').value.trim(), vendor: $('#cost_vendor').value.trim(), amount: amt, date: $('#cost_date').value || today()}); commitSub(); },
  costDel(d) { grab(); S.modal.row.costs.splice(+d.i, 1); commitSub(); },

  async delPhoto(d) { if (!confirm('Remove this photo?')) return; grab(); const p = S.modal.row.photos.splice(+d.i, 1)[0]; if (p) B.unupload(p.path); await commitSub(); },
  composeWork() { grab(); const w = S.modal.row; if (!wo(w.id)) { toast('Create the work order first', 'bad'); return; } S.modal = {type:'compose', back: S.modal, ctx:{workId: w.id, to: w.assignee_id ? [w.assignee_id] : []}}; renderModal(); },
  composeGeneral() { S.modal = {type:'compose', ctx:{}}; renderModal(); },
  composeContact() { grab(); const c = S.modal.row; S.modal = {type:'compose', ctx:{to:[c.id]}}; renderModal(); },
  async requesterUpdate() {
    grab(); const w = S.modal.row;
    if (!S.emailCfg) { openMailto([w.requester_email], `Your DELC facilities request #${w.num}`, `Hi ${w.requested_by || ''},\n\nThank you for letting us know about "${w.title}". ${w.status === 'done' ? 'It has been taken care of.' : 'Our Facilities team has it and will follow up.'}\n\n${me()}\nDELC Facilities`); return; }
    const r = await B.fn({mode:'requester_update', work_id: w.id, sent_by: me()}); toast(r.ok ? 'Update sent to ' + w.requester_email : 'Not sent: ' + r.error, r.ok ? 'ok' : 'bad');
  },
  async emailSend() {
    const ctx = S.modal.ctx; const ids = $$('.to_c:checked').map(c => c.value); if (!ids.length) { toast('Pick at least one person', 'bad'); return; }
    const subject = $('#em_subj').value.trim() || 'DELC Facilities', text = $('#em_body').value; const det = $('#em_details') ? $('#em_details').checked : false;
    const btn = $('[data-act=emailSend]'); btn.disabled = true; btn.textContent = 'Sending…';
    const r = await B.fn({mode:'send', to_contact_ids: ids, subject, text, work_id: ctx.workId || null, attach_details: det, sent_by: me()});
    if (r.ok) {
      toast(`Sent to ${ids.length} ${ids.length === 1 ? 'person' : 'people'}`, 'ok');
      if (ctx.workId) { const w = wo(ctx.workId); if (w) save('work', {...clone(w), log: [...(w.log || []), {at: nowIso(), by: me(), text: 'Emailed ' + ids.map(cname).join(', ') + ': ' + subject}]}).catch(() => {}); }
      S.modal = S.modal.back ? {...S.modal.back, row: clone(wo(S.modal.back.row.id) || S.modal.back.row)} : null; renderModal(); reload();
    } else { btn.disabled = false; btn.textContent = 'Send'; toast('Not sent: ' + (r.error === 'not_configured' ? 'automatic email isn’t set up — use “Open in my email app”' : r.error), 'bad'); }
  },
  mailtoSend() {
    const ctx = S.modal.ctx; const ids = $$('.to_c:checked').map(c => c.value); const emails = ids.map(id => (cn(id) || {}).email).filter(Boolean);
    let body = $('#em_body').value; const w = ctx.workId && wo(ctx.workId);
    if (w && $('#em_details') && $('#em_details').checked) body += '\n\n— — —\n' + workText(w);
    openMailto(emails, $('#em_subj').value, body);
  },
  newPm(d) { S.modal = {type:'pm', row:{id: uid(), title:'', category:'', asset_id: d.asset || null, location: d.asset ? (asset(d.asset) || {}).location || '' : '', every_n: 3, every_unit:'month', next_due: today(), assignee_id: null, checklist: [], est_cost: 0, remind_days: 7, notes:'', active: true}}; renderModal(); },
  openPm(d, e) { if (e) { e.preventDefault(); e.stopPropagation(); } const p = pmOf(d.id); if (!p) return; S.modal = {type:'pm', row: clone(p)}; renderModal(); },
  async savePm() {
    grab(); const r = S.modal.row; if (!r.title) { toast('Give the task a name', 'bad'); return; }
    if (!r.next_due) r.next_due = today(); r.every_n = Math.max(1, r.every_n | 0);
    const prev = pmOf(r.id); if (prev && prev.next_due !== r.next_due) r.last_reminded_for = null;
    try { await save('pm', clone(r)); } catch (e) { return; } toast(prev ? 'Saved' : 'Schedule created', 'ok'); S.modal = null; renderModal(); renderApp();
  },
  async delPm() { const p = S.modal.row; if (!confirm(`Delete the schedule “${p.title}”? Past work orders are kept.`)) return; await del('pm', p.id); S.modal = null; renderModal(); renderApp(); },
  pmToWork(d, e) { if (e) e.stopPropagation(); const p = pmOf(d.id); if (!p) return;
    const ow = openPmWork(p); if (ow) { ACT.openWork({id: ow.id}); return; }
    S.modal = {type:'work', row: newWorkRow('pm', {title: p.title, location: p.location || (asset(p.asset_id) || {}).location || '', asset_id: p.asset_id, pm_id: p.id, assignee_id: p.assignee_id, due_date: p.next_due, checklist: (p.checklist || []).map(c => ({text: c.text, done: false})), description: p.notes || '', requested_by: 'Maintenance schedule'})}; renderModal(); },
  pmDone(d, e) { if (e) e.stopPropagation(); S.modal = {type:'pmdone', id: d.id}; renderModal(); },
  async pmDoneSave(d) {
    const p = pmOf(d.id); const date = $('#pd_date').value || today(); const cost = num($('#pd_cost').value); const who = $('#pd_who').value || null; const notes = $('#pd_notes').value.trim();
    const ow = openPmWork(p);
    const row = ow ? clone(ow) : newWorkRow('pm', {title: p.title, location: p.location || '', asset_id: p.asset_id, pm_id: p.id, requested_by: 'Maintenance schedule', checklist: (p.checklist || []).map(c => ({text: c.text, done: true}))});
    row.status = 'done'; row.done_at = new Date(date + 'T12:00:00').toISOString(); row.assignee_id = who || row.assignee_id; row.due_date = row.due_date || p.next_due;
    if (cost) row.costs = [...(row.costs || []), {id: uid(), desc: p.title, vendor: who ? cname(who) : '', amount: cost, date}];
    row.log = [...(row.log || []), {at: nowIso(), by: me(), text: 'Marked done' + (notes ? ': ' + notes : '')}];
    (row.checklist || []).forEach(c => c.done = true);
    try { await save('work', row); } catch (e) { return; }
    const nx = advancePm(p.id, date); toast(`Done — next due ${fmtD(nx)}`, 'ok'); S.modal = null; renderModal(); renderApp();
  },
  async seedPm() {
    const t = today(); const mk = (title, category, n, unit, ck) => ({id: uid(), title, category, every_n: n, every_unit: unit, next_due: t, checklist: ck.map(text => ({text, done:false})), remind_days: 7, active: true, est_cost: 0, notes: '', location: ''});
    const rows = [mk('Replace HVAC filters', 'HVAC', 3, 'month', ['Turn off unit', 'Replace filter (note size)', 'Write date on filter']),
      mk('Fire extinguisher inspection', 'Fire & Safety', 1, 'year', ['Check pressure gauge', 'Check pin & seal', 'Sign inspection tag']),
      mk('Test smoke & CO detectors', 'Fire & Safety', 6, 'month', ['Press test button on each', 'Replace batteries if needed']),
      mk('Clean gutters & downspouts', 'Roof & Exterior', 6, 'month', ['Clear gutters', 'Flush downspouts', 'Check for damage']),
      mk('Test emergency & exit lights', 'Fire & Safety', 1, 'month', ['Press test on each fixture', 'Note any that fail']),
      mk('Building walk-through', 'Building', 1, 'month', ['Check for leaks / stains', 'Doors & locks work', 'Lights out', 'Trip hazards'])];
    for (const r of rows) await save('pm', r).catch(() => {}); toast('Added 6 schedules — set the real due dates and who does them', 'ok'); renderApp();
  },
  newAsset() { S.modal = {type:'asset', row:{id: uid(), name:'', category:'', location:'', photos: [], active: true}}; renderModal(); },
  openAsset(d) { const a = asset(d.id); if (!a) return; S.modal = {type:'asset', row: clone(a)}; renderModal(); },
  async saveAsset() { grab(); const r = S.modal.row; if (!r.name) { toast('Give it a name', 'bad'); return; } const prev = asset(r.id); try { await save('assets', clone(r)); } catch (e) { return; } toast(prev ? 'Saved' : 'Added', 'ok'); S.modal = null; renderModal(); renderApp(); },
  async delAsset() { const a = S.modal.row; if (!confirm(`Delete “${a.name}”? Its work orders and schedules are kept.`)) return; await del('assets', a.id); S.modal = null; renderModal(); renderApp(); },
  newContact() { S.modal = {type:'contact', row:{id: uid(), name:'', kind:'volunteer', active: true}}; renderModal(); setTimeout(() => { const el = $('#modal [data-f=name]'); el && el.focus(); }, 40); },
  openContact(d) { const c = cn(d.id); if (!c) return; S.modal = {type:'contact', row: clone(c)}; renderModal(); },
  async saveContact() { grab(); const r = S.modal.row; if (!r.name) { toast('Enter a name', 'bad'); return; } if (r.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email)) { toast('That email address doesn’t look right', 'bad'); return; }
    const prev = cn(r.id); try { await save('contacts', clone(r)); } catch (e) { return; } toast(prev ? 'Saved' : 'Added ' + r.name, 'ok'); S.modal = null; renderModal(); renderApp(); },
  async delContact() { const c = S.modal.row; const n = S.work.filter(w => w.assignee_id === c.id && isOpen(w)).length;
    if (!confirm(`Delete ${c.name}?${n ? `\n\nThey have ${n} open job(s) — those become unassigned. Tip: untick “Active” instead to keep their history.` : ''}`)) return;
    for (const w of S.work.filter(w => w.assignee_id === c.id && isOpen(w))) await save('work', {...clone(w), assignee_id: null}).catch(() => {});
    await del('contacts', c.id); S.modal = null; renderModal(); renderApp(); },
  async checkEmail() { S.emailCfg = undefined; renderApp(); await checkEmail(); renderApp(); },
  copyLink() { const el = $('#publink'); el.select(); (navigator.clipboard ? navigator.clipboard.writeText(el.value) : Promise.reject()).then(() => toast('Link copied', 'ok')).catch(() => { document.execCommand('copy'); toast('Link copied', 'ok'); }); },
  async saveLists() {
    const lines = id => [...new Set($(id).value.split('\n').map(s => s.trim()).filter(Boolean))];
    await saveSettings({locations: lines('#set_locs'), categories: lines('#set_cats')}); toast('Saved', 'ok'); renderApp();
  },
  exportJson() {
    const data = {app:'delc-facilities', version:1, exported_at: nowIso(), contacts: S.contacts, assets: S.assets, pm: S.pm, work: S.work, settings: S.settings};
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}));
    a.download = `delc-facilities-backup-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  importJson() { const f = $('#jsonFile'); f.value = ''; f.onchange = () => f.files[0] && restore(f.files[0]); f.click(); },
  pubType(d) { P.type = d.v; $$('.choice button').forEach(b => b.classList.toggle('on', b.dataset.v === d.v)); },
  pubDelPhoto(d) { const keep = {}; ['pb_title','pb_loc','pb_desc','pb_name','pb_phone','pb_email'].forEach(id => keep[id] = $('#' + id).value); P.photos.splice(+d.i, 1); renderApp(); Object.entries(keep).forEach(([id, v]) => $('#' + id).value = v); },
  pubSubmit
};
async function restore(file) {
  try {
    const d = JSON.parse(await file.text()); if (d.app !== 'delc-facilities') throw new Error('Not a DELC Facilities backup');
    if (!confirm(`Restore ${d.work.length} work orders, ${d.pm.length} schedules, ${d.assets.length} equipment items and ${d.contacts.length} people? Records with the same ID are overwritten; nothing is deleted.`)) return;
    for (const k of ['contacts','assets','pm','work']) for (const r of d[k] || []) await B.upsert(k, r);
    if (d.settings) await B.saveSettings(d.settings);
    toast('Backup restored', 'ok'); reload();
  } catch (e) { toast('Restore failed: ' + (e.message || e), 'bad'); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if (!fn) return;
  if (b.dataset.act === 'bgClose' && b !== e.target) return;
  fn(b.dataset, e, b);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'lp' || e.target.id === 'lu')) ACT.login();
  if (e.key === 'Enter' && e.target.id === 'ck_new') { e.preventDefault(); ACT.ckAdd(); }
  if (e.key === 'Enter' && e.target.id === 'log_new') { e.preventDefault(); ACT.logAdd(); }
  if (e.key === 'Enter' && e.target.id === 'cost_amt') { e.preventDefault(); ACT.costAdd(); }
  if (e.key === 'Escape') { if ($('#lightbox').innerHTML) $('#lightbox').innerHTML = ''; else if (S.modal) { S.modal = null; renderModal(); } }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.inp; if (k) { S[k] = e.target.value; renderApp(); }
  if (e.target.id === 'pd_date') { const p = S.modal && pmOf(S.modal.id); const el = $('#pd_next'); if (p && el) el.value = fmtD(addInterval(e.target.value || today(), p.every_n, p.every_unit)); }
});
document.addEventListener('change', async e => {
  const el = e.target; if (el.closest('#modal') && el.dataset.f === 'type' && S.modal && S.modal.row) { reModal(); return; }
  const k = el.dataset.chg; if (!k) return;
  if (k === 'ckTick') { grab(); S.modal.row.checklist[+el.dataset.i].done = el.checked; commitSub(); return; }
  if (k === 'photoTag') { grab(); S.modal.row.photos[+el.dataset.i].tag = el.value; commitSub(); return; }
  if (k === 'addPhotos') {
    const files = [...el.files]; if (!files.length) return; grab(); const row = S.modal.row; const kind = S.modal.type === 'asset' ? 'assets' : 'work';
    toast(`Uploading ${files.length} photo${files.length === 1 ? '' : 's'}…`);
    for (const f of files) {
      try { const up = await B.upload(f, `${kind}/${row.id}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.jpg`); (row.photos = row.photos || []).push({...up, at: nowIso(), by: me(), tag: ''}); }
      catch (err) { console.error(err); toast('A photo didn’t upload: ' + (err.message || err), 'bad'); }
    }
    if (S.modal && S.modal.row === row) await commitSub(); return;
  }
  if (k === 'pubPhotos') {
    const keep = {}; ['pb_title','pb_loc','pb_desc','pb_name','pb_phone','pb_email'].forEach(id => keep[id] = $('#' + id).value); const urgent = $('#pb_urgent').checked;
    for (const f of [...el.files].slice(0, 4 - P.photos.length)) { const small = await shrink(f, 1600); P.photos.push({file: small, preview: await blobToDataUrl(await shrink(f, 300))}); }
    renderApp(); Object.entries(keep).forEach(([id, v]) => $('#' + id).value = v); $('#pb_urgent').checked = urgent; return;
  }
  if (k === 'notify') { const ids = $$('[data-chg=notify]:checked').map(c => c.value); await saveSettings({notifyIds: ids}); toast('Saved', 'ok'); return; }
  if (k === 'setflag') { await saveSettings({[el.dataset.k]: el.checked}); toast('Saved', 'ok'); return; }
});

/* ---------------- boot ---------------- */
async function boot() {
  B = S.backend === 'local' ? Local : Remote;
  if (B === Remote) { try { Remote.init(); } catch (e) { $('#app').innerHTML = viewLogin('Could not connect to the database.'); return; } }
  S.view = lsGet('fac_view') || 'dash'; renderApp();
  await reload();
  B.subscribe(remoteChanged);
  const deep = new URLSearchParams(location.search).get('wo');
  if (deep) { history.replaceState(null, '', location.pathname); if (wo(deep)) { S.view = 'work'; renderApp(); ACT.openWork({id: deep}); } else toast('That work order wasn’t found — it may have been deleted', 'bad'); }
  checkEmail().then(renderApp);
}
window.addEventListener('beforeunload', () => lsSet('fac_view', S.view));
function signIn(session, fallbackUser) {
  S.backend = 'remote'; lsSet('fac_backend', 'remote');
  S.user = session ? session.username : fallbackUser; S.userName = session ? (session.displayName || session.username) : fallbackUser;
  lsSet('fac_user', S.user);
}
function hubSession() { if (!window.DelcAuth) return null; try { const s = DelcAuth.getSession(); return s && DelcAuth.hasAppAccess(s, CONFIG.appKey) ? s : null; } catch (_) { return null; } }
(async function start() {
  const params = new URLSearchParams(location.search);
  if (params.get('demo') === '1') lsSet('fac_backend', 'local');
  const backend = lsGet('fac_backend') || 'remote';
  if (PUBLIC) {
    B = backend === 'local' ? Local : Remote; S.backend = backend;
    if (B === Remote) { try { Remote.init(); const st = await Remote.q(Remote.sb.from('fac_settings').select('data').eq('id', 'main').maybeSingle()); S.settings = (st && st.data) || {}; } catch (e) { console.warn(e); } }
    else S.settings = Local.db().settings;
    renderApp(); return;
  }
  if (backend === 'local') { S.backend = 'local'; S.user = lsGet('fac_user'); S.userName = S.user; if (S.user) boot(); else renderApp(); return; }
  let sess = hubSession();
  if (sess && DelcAuth.refreshSession) { try { await DelcAuth.refreshSession(); sess = hubSession(); } catch (_) {} }
  if (sess && window.supabase) { signIn(sess); boot(); return; }
  S.user = null;
  const s0 = window.DelcAuth && (() => { try { return DelcAuth.getSession(); } catch (_) { return null; } })();
  $('#app').innerHTML = viewLogin(s0 ? `You’re signed in to the hub as ${s0.username}, but your account doesn’t have access to delcFACILITIES. Ask an admin to turn it on, or sign in as someone else.` : '');
})();
</script>
