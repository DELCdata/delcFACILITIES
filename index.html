<style>

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent}

button{cursor:pointer}

.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px;white-space:nowrap;font-size:16px}
.logo{background:#fff;color:var(--navy);border-radius:6px;padding:2px 7px;font-weight:800;font-size:14px}

/* generic */
.page{max-width:1240px;margin:0 auto;padding:18px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;color:var(--navy);white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{color:var(--bad);border-color:#efc2bd}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.xs{padding:3px 8px;font-size:12px;border-radius:7px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}

.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);font-size:15px;min-width:0;width:100%}

label.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:#eef1f6;color:var(--navy);white-space:nowrap}

.chip.gold{background:var(--gold2);color:var(--navy)}
.empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:14px}
.sectitle{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:4px 0 6px}
/* login */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login{width:100%;max-width:400px}
.login h1{margin:6px 0 2px;color:var(--navy);font-size:24px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.link{background:none;border:0;color:var(--navy2);text-decoration:underline;padding:0;font-size:13px;text-align:left}
/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left}
.stat b{display:block;font-size:26px;color:var(--navy);line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.stat.alert{border-color:#efb3ab;background:#fff7f6}.stat.alert b{color:var(--bad)}
.dash{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;gap:12px;align-items:center;cursor:pointer}
.item:hover{border-color:#c7ccd6}
.item .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;background:#f1f3f7}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.item .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.item .thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;border:1px solid var(--line)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .inp{width:auto;flex:1;min-width:180px}
.seg{display:inline-flex;background:#e9eaee;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-weight:600;font-size:13px;color:#444}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bar{height:8px;background:#eceef2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}

.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.pcard .ph{height:130px;background:#eef0f4 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:34px;color:#b5bccb}

table.tb{width:100%;border-collapse:collapse;font-size:14px;background:#fff}

table.tb td{padding:8px;border-bottom:1px solid #f0f0f2;vertical-align:top}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}

.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:#fff;width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.modal.wide{max-width:980px}
@media(min-width:760px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:20px}}
.modal h2{margin:0;color:var(--navy);font-size:20px}
.mhead{display:flex;align-items:flex-start;gap:10px;justify-content:space-between;margin-bottom:14px}
.x{border:0;background:#f1f1f3;border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1;flex:none}
.mgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;border-top:1px solid var(--line);padding-top:12px;margin-top:14px;position:sticky;bottom:-18px;background:#fff;padding-bottom:4px}
.box{border:1px solid var(--line);border-radius:14px;padding:12px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photo{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#f4f4f6}
.photo img{width:100%;height:90px;object-fit:cover;display:block;cursor:zoom-in}
.photo .cap{font-size:11px;padding:3px 5px;display:flex;gap:4px;align-items:center}
.photo .cap select{font-size:11px;border:0;background:transparent;padding:0;max-width:70px}
.photo .del{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;line-height:1}
.photo .tag{position:absolute;left:4px;top:4px;background:rgba(27,50,84,.85);color:#fff;border-radius:6px;font-size:10px;font-weight:700;padding:1px 5px;text-transform:uppercase}
.addphoto{border:2px dashed #cfd4dd;border-radius:10px;height:90px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;background:#fff}
.addphoto:hover{border-color:var(--navy);color:var(--navy)}
.ck{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #f3f3f5}
.ck input[type=checkbox]{width:18px;height:18px;flex:none}
.ck span{flex:1}
.ck.done span{text-decoration:line-through;color:var(--muted)}
.rm{border:0;background:none;color:#b0b5bf;font-size:14px;padding:2px 6px}
.rm:hover{color:var(--bad)}
.logline{font-size:13px;padding:6px 0;border-bottom:1px solid #f3f3f5}
.logline b{color:var(--navy)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.lightbox img{max-width:100%;max-height:92vh;border-radius:8px}
.rcpt{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px}
.rcpt label{display:flex;gap:7px;align-items:flex-start;font-size:13px;padding:4px}
.notice{background:var(--warnbg);color:#6b4500;border-radius:12px;padding:10px 12px;font-size:13px}
.notice.info{background:var(--infobg);color:#1f3f86}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:92vw}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}
/* public form */
.pub{max-width:560px;margin:0 auto;padding:18px}
.pubhead{background:var(--navy);color:#fff;border-radius:18px;padding:18px;margin-bottom:14px}
.pubhead h1{margin:6px 0 2px;font-size:22px}
.choice{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choice button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 6px;font-weight:700;color:var(--navy);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.choice button.on{border-color:var(--navy);background:#eef3fa}
.choice button span{font-size:24px}
@media(max-width:900px){.dash,.mgrid{grid-template-columns:1fr}}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr}.page{padding:12px}.item .right{display:none}.top{padding:8px 12px;gap:8px}.top .uname{display:none}.tabs{position:static}}
#wo-print{display:none;font-size:13px;color:#18233a}
#wo-print h3{font-size:14px;margin:16px 0 6px;color:#1B3254;border-bottom:1.5px solid #1B3254;padding-bottom:3px}
#wo-print .wo-kv th{text-align:left;color:#5d6a82;font-weight:600;padding:3px 16px 3px 0;white-space:nowrap;vertical-align:top}#wo-print .wo-kv td{padding:3px 0}
#wo-print .wo-desc{white-space:pre-wrap;line-height:1.45}#wo-print .wo-blank{color:#5d6a82;font-style:italic}
#wo-print .wo-ck{list-style:none;padding:0;margin:0}#wo-print .wo-ck li{display:flex;gap:8px;align-items:center;padding:3px 0}#wo-print .wo-cb{width:14px;height:14px;border:1.5px solid #1B3254;border-radius:3px;display:inline-grid;place-items:center;font-size:11px;font-weight:800}
#wo-print .wo-tbl{width:100%;border-collapse:collapse}#wo-print .wo-tbl th,#wo-print .wo-tbl td{text-align:left;padding:4px 6px;border-bottom:1px solid #dbe1ea;vertical-align:top}#wo-print .wo-tbl th{font-size:11px;text-transform:uppercase;color:#5d6a82}#wo-print .r{text-align:right}#wo-print .tot td{font-weight:700;border-top:1.5px solid #1B3254}
#wo-print .wo-log td:first-child{white-space:nowrap;width:1%}#wo-print .wo-ph{display:flex;gap:8px;flex-wrap:wrap}#wo-print .wo-ph img{width:150px;height:112px;object-fit:cover;border-radius:6px;border:1px solid #ccc}
#wo-print .wo-lines div{border-bottom:1px solid #999;height:26px}#wo-print .wo-sign{display:grid;grid-template-columns:2fr 1fr 1fr;gap:18px;margin-top:26px}#wo-print .wo-sign div{border-top:1px solid #333;padding-top:3px;font-size:11px;color:#5d6a82}
#wo-print h3,#wo-print .wo-sign{break-inside:avoid}
@media print{
  .top,.tabs,.demo-banner,.toolbar,.btn,#toast,.mfoot,.addphoto,.rm,.del,.x{display:none!important}
  body{background:#fff}
  body.print-modal #app{display:none}
  body.print-modal .modal-bg{position:static;background:none;display:block}
  body.print-modal .modal{max-height:none;box-shadow:none;max-width:none;overflow:visible}
  body.print-modal .mhead h2{display:none}
  @page{margin:.5in}
  body.print-wo #app,body.print-wo #modal,body.print-wo #toast{display:none!important}
  body.print-wo #wo-print{display:block!important}
  .card,.item,.box{break-inside:avoid}
}

/* shared header buttons (2026-11-14) — same look in every delcAPP; delc-kit.js carries the full rule, this is the fallback */
.delc-hbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:5px 11px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;cursor:pointer}.delc-hbtn.pri{background:#fff;color:#1B3254}

.delc-signin-links .sec{font-weight:500;color:#5d6a82}

/* tab standard: delcPEOPLE underline tabs */
.tabs{border-top:1px solid #2c4870;padding:0 12px!important;gap:2px!important}
.tabs .tab{background:none!important;border:0!important;border-bottom:3px solid transparent!important;border-radius:0!important;box-shadow:none!important;color:#c3cfe2!important;padding:10px 14px!important;font-size:14px!important;font-weight:600!important;font-family:inherit!important;line-height:1.3!important;white-space:nowrap;cursor:pointer;flex:0 0 auto!important;min-height:0!important}
.tabs .tab.on{color:#fff!important;border-bottom-color:#fff!important;background:none!important}
.tabs .tab:not(.on):hover{color:#fff!important;background:none!important}

/* print letterhead (2026-11-14) */
.delc-print-only{display:none}
@media print{.delc-print-only{display:block!important}}
</style>

const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const dOf = iso => { const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const daysFrom = iso => Math.round((dOf(iso) - dOf(today())) / 86400000);

function addInterval(iso, n, unit) {
  const d = dOf(iso || today()); n = Math.max(1, n | 0);
  if (unit === 'day') d.setDate(d.getDate() + n);
  else if (unit === 'week') d.setDate(d.getDate() + 7 * n);
  else if (unit === 'year') d.setFullYear(d.getFullYear() + n);
  else { const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); }
  return isoOf(d);
}

/* ---------------- photos: shrink before upload ---------------- */
async function shrink(file, max) {
  try {
    const bmp = await createImageBitmap(file, {imageOrientation: 'from-image'});
    const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    return blob || file;
  } catch (e) { return file; }
}
const blobToDataUrl = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });

/* ---------------- backends ---------------- */
const Local = {
  key: 'fac_demo_db',
  db() { const d = lsGet(this.key) || {}; ['contacts','assets','pm','work','emails'].forEach(k => d[k] = d[k] || []); d.settings = d.settings || {}; d.seq = d.seq || 1000; return d; },
  save(d) { try { localStorage.setItem(this.key, JSON.stringify(d)); } catch (e) { toast('Demo storage is full — remove some photos', 'bad'); } },
  async loadAll() { const d = this.db(); return {contacts:d.contacts, assets:d.assets, pm:d.pm, work:d.work, emails:d.emails.slice().reverse(), settings:d.settings}; },
  async upsert(kind, row) { const d = this.db(); if (kind === 'work' && !row.num) row.num = ++d.seq; const a = d[kind]; const i = a.findIndex(x => x.id === row.id); if (i >= 0) a[i] = row; else a.push(row); this.save(d); return row; },
  async remove(kind, id) { const d = this.db(); d[kind] = d[kind].filter(r => r.id !== id); this.save(d); },
  async saveSettings(data) { const d = this.db(); d.settings = data; this.save(d); },
  async upload(blob, path) { const small = await shrink(blob, 900); return {path, url: await blobToDataUrl(small)}; },
  async unupload() {},
  async fn(body) { if (body.mode === 'status') return {ok:true, provider:null}; return {ok:false, error:'not_configured'}; },
  subscribe() {}, unsubscribe() {}
};
const Remote = {
  sb: null, ch: null,
  init() { this.sb = window.supabase.createClient(CONFIG.url, CONFIG.key); },
  async q(p) { const {data, error} = await p; if (error) throw error; return data; },
  async loadAll() {
    const sel = t => this.q(this.sb.from(t).select('*'));
    const [contacts, assets, pm, work, emails, st] = await Promise.all([sel('fac_contacts'), sel('fac_assets'), sel('fac_pm'), sel('fac_work'),
      this.q(this.sb.from('fac_emails').select('*').order('created_at', {ascending:false}).limit(300)).catch(() => []),
      this.q(this.sb.from('fac_settings').select('data').eq('id', 'main').maybeSingle()).catch(() => null)]);
    return {contacts, assets, pm, work, emails, settings: (st && st.data) || {}};
  },
  async upsert(kind, row) {
    const r = {...row}; if (kind === 'work' && !r.num) delete r.num;
    const data = await this.q(this.sb.from(TBL[kind]).upsert(r).select().single());
    return data;
  },
  remove(kind, id) { return this.q(this.sb.from(TBL[kind]).delete().eq('id', id)); },
  saveSettings(data) { return this.q(this.sb.from('fac_settings').upsert({id:'main', data, updated_at: nowIso()})); },
  async upload(blob, path) {
    const small = await shrink(blob, 1600);
    const {error} = await this.sb.storage.from(CONFIG.bucket).upload(path, small, {contentType: small.type || 'image/jpeg', upsert: false});
    if (error) throw error;
    return {path, url: this.sb.storage.from(CONFIG.bucket).getPublicUrl(path).data.publicUrl};
  },
  async unupload(path) { if (path) await this.sb.storage.from(CONFIG.bucket).remove([path]).catch(() => {}); },
  async fn(body) {
    try {
      const r = await fetch(`${CONFIG.url}/functions/v1/${CONFIG.fn}`, {method:'POST', headers:{'Content-Type':'application/json', apikey: CONFIG.fnKey, Authorization: 'Bearer ' + CONFIG.fnKey}, body: JSON.stringify(body)});
      const j = await r.json().catch(() => ({ok:false, error:'Bad response (' + r.status + ')'}));
      if (r.status === 404) return {ok:false, error:'not_configured'};
      return j;
    } catch (e) { return {ok:false, error:'Could not reach the email service'}; }
  },
  subscribe(cb) {
    this.unsubscribe();
    const ch = this.sb.channel('fac-' + Math.random().toString(36).slice(2, 7));
    ['fac_work','fac_pm','fac_contacts','fac_assets'].forEach(t => ch.on('postgres_changes', {event:'*', schema:'public', table:t}, cb));
    ch.subscribe(); this.ch = ch;
  },
  unsubscribe() { if (this.ch) { this.sb.removeChannel(this.ch); this.ch = null; } }
};
let B = Remote;

/* ---------------- store ---------------- */
function arr(kind) { return S[kind]; }
async function save(kind, row, quiet) {
  row.updated_at = nowIso(); if (!row.created_at) row.created_at = row.updated_at;
  const a = arr(kind); const i = a.findIndex(r => r.id === row.id); if (i >= 0) a[i] = row; else a.push(row);
  try { const saved = await B.upsert(kind, row); if (saved) { const j = a.findIndex(r => r.id === row.id); if (j >= 0) a[j] = saved; return saved; } return row; }
  catch (e) { console.error(e); toast('Could not save: ' + (e.message || e), 'bad'); if (!quiet) reload(); throw e; }
}
async function del(kind, id) {
  const a = arr(kind); const i = a.findIndex(r => r.id === id); if (i >= 0) a.splice(i, 1);
  try { await B.remove(kind, id); } catch (e) { toast('Could not delete: ' + (e.message || e), 'bad'); reload(); }
}
async function saveSettings(patch) {
  S.settings = {...S.settings, ...patch};
  try { await B.saveSettings(S.settings); } catch (e) { toast('Could not save settings: ' + (e.message || e), 'bad'); }
}
async function reload() {
  try { const d = await B.loadAll(); Object.assign(S, d); S.loaded = true; } catch (e) { console.error(e); toast('Could not load data: ' + (e.message || e), 'bad'); }
  renderApp();
}

function pmState(p) {
  if (!p.active) return {cls:'gray', txt:'Paused', rank:9};
  if (!p.next_due) return {cls:'gray', txt:'No date', rank:8};
  const d = daysFrom(p.next_due);
  if (d < 0) return {cls:'bad', txt:`Overdue ${-d} day${d === -1 ? '' : 's'}`, rank:0, d};
  if (d === 0) return {cls:'bad', txt:'Due today', rank:1, d};
  if (d <= Math.max(7, p.remind_days || 7)) return {cls:'warn', txt:`Due in ${d} day${d === 1 ? '' : 's'}`, rank:2, d};
  return {cls:'', txt:'Due ' + fmtD(p.next_due), rank:3, d};
}
const openPmWork = p => S.work.find(w => w.pm_id === p.id && isOpen(w));
function workSort(a, b) {
  const pr = {urgent:0, high:1, normal:2, low:3}; const st = {new:0, assigned:1, in_progress:1, on_hold:2, done:3, cancelled:4};
  return (st[a.status] ?? 5) - (st[b.status] ?? 5) || (pr[a.priority] ?? 2) - (pr[b.priority] ?? 2) || String(a.due_date || '9999').localeCompare(String(b.due_date || '9999')) || (b.num || 0) - (a.num || 0);
}

function grab() {   // copy form fields into the row being edited (so re-renders don't lose typing)

    const f = el.dataset.f, t = el.dataset.t;

function advancePm(pmId, doneIso) {
  const p = pmOf(pmId); if (!p) return null;
  const next = addInterval(doneIso, p.every_n, p.every_unit);
  save('pm', {...clone(p), last_done: doneIso, next_due: next, last_reminded_for: null}).catch(() => {});

async function saveWork(markDone) {
  grab(); const r = S.modal.row; const prev = wo(r.id);
  if (!r.title) { toast('Give it a short title first', 'bad'); return; }
  if (markDone) r.status = 'done';
  if (r.status === 'new' && r.assignee_id && (!prev || prev.status === 'new')) r.status = 'assigned';
  const log = r.log = r.log || [];
  if (!prev) log.push({at: nowIso(), by: me(), text: 'Created'});
  else {
    if (prev.status !== r.status) log.push({at: nowIso(), by: me(), text: 'Status: ' + (STATUS[prev.status] || {}).name + ' → ' + (STATUS[r.status] || {}).name});
    if (prev.assignee_id !== r.assignee_id) log.push({at: nowIso(), by: me(), text: r.assignee_id ? 'Assigned to ' + cname(r.assignee_id) : 'Unassigned'});
  }
  if (r.status === 'done' && (!prev || prev.status !== 'done')) { r.done_at = nowIso(); (r.checklist || []).forEach(c => { if (markDone) c.done = true; }); }
  if (r.status !== 'done') r.done_at = null;
  let saved; try { saved = await save('work', clone(r)); } catch (e) { return; }
  let msg = prev ? 'Saved' : `Created #${saved.num || ''}`;
  if (saved.status === 'done' && (!prev || prev.status !== 'done') && saved.pm_id) { const nx = advancePm(saved.pm_id, today()); if (nx) msg += ` · next due ${fmtD(nx)}`; }
  toast(msg, 'ok'); S.modal = null; renderModal(); renderApp();
  if (saved.assignee_id && (!prev || prev.assignee_id !== saved.assignee_id) && S.settings.autoAssign !== false && saved.status !== 'done') autoEmail('assigned', saved);
  if (saved.status === 'done' && prev && prev.status !== 'done' && saved.source === 'public' && saved.requester_email && S.settings.autoRequester !== false) autoEmail('requester_update', saved);
}

/* ======== Key holders are people in delcPEOPLE (2026-11-13) ========
   The name box offers everyone in delcPEOPLE. Picking someone links the key holder to that person; a brand-new name is added to
   delcPEOPLE when you save (the database does the linking). Only names, phones and emails are read here — nothing else from delcPEOPLE. */
S.people = []; S.pplOff = false;
async function loadPeopleList() {
  if (B !== Remote || !Remote.sb) return;
  try { await Remote.q(Remote.sb.from('fac_key_holders').select('person_id').limit(1)); S.pplOff = false; } catch (_) { S.pplOff = true; }
  try { const r = await Remote.q(Remote.sb.from('people_records').select('id,first:data->>first,last:data->>last,phone:data->>phone,email:data->>email,active:data->>active').eq('kind', 'people'));
    S.people = (r || []).filter(p => p.active !== 'false').map(p => ({id: p.id, name: ((p.first || '') + ' ' + (p.last || '')).replace(/\s+/g, ' ').trim(), phone: p.phone || '', email: p.email || ''})).filter(p => p.name).sort((a, b) => a.name.localeCompare(b.name));
  } catch (e) { console.warn('delcPEOPLE list', e); }
  const dl = document.getElementById('ppl_list'); if (dl) dl.innerHTML = pplOpts();
}

const pplFind = name => { const n = String(name || '').replace(/\s+/g, ' ').trim().toLowerCase(); return n ? S.people.find(p => p.name.toLowerCase() === n) : null; };
function pplHint(h) { if (!S.people.length) return ''; const p = (h.person_id && S.people.find(x => x.id === h.person_id)) || pplFind(h.name);
  return p ? `✓ Linked to <b>${esc(p.name)}</b> in delcPEOPLE — name, phone and email stay in step.` : 'Start typing to pick someone from delcPEOPLE. A new name is added to delcPEOPLE when you save.'; }

  const hint = document.getElementById('ppl_hint'); if (hint) hint.innerHTML = pplHint({...h, name: e.target.value, person_id: p ? p.id : h.person_id}); });

/* ---- photos: tap to see large + choose what shows in reports (Derek, 2026-11-14) ----
   The original photo is never changed. p.crop = {cx, cy, cw, ar}: centre (0–1) and width (fraction of the photo) of a 4:3 frame,
   ar = the photo's width/height. Reports and work order printouts show only that part; without it they show the middle. */
function facPhotoImg(p) {
  const c = p && p.crop, A = 4 / 3;
  if (!c || !c.cw || !c.ar) return `<span class="cimg"><img src="${esc(p.url)}" alt="" style="width:100%;height:100%;object-fit:cover"></span>`;
  const ch = c.cw * c.ar / A, w = 100 / c.cw, h = 100 / ch, l = -(c.cx - c.cw / 2) / c.cw * 100, t = -(c.cy - ch / 2) / ch * 100;
  return `<span class="cimg"><img src="${esc(p.url)}" alt="" style="position:absolute;max-width:none;width:${w.toFixed(3)}%;height:${h.toFixed(3)}%;left:${l.toFixed(3)}%;top:${t.toFixed(3)}%"></span>`;
}
/* on-screen thumbnails use the same 4:3 framing as the reports, so the screen matches what prints */
function facThumb(p, i) { return facPhotoImg(p).replace('<span class="cimg"', `<span class="cimg pthumb${p.crop ? ' framed' : ''}" data-act="zoom" data-i="${i}" role="button" tabindex="0" title="${p.crop ? 'Framed for reports — tap to see it large or change the framing' : 'Tap to see it large'}"`); }
function facPhotoSaveCrop(i, crop) {
  const m = S.modal; if (!m || !m.row || !m.row.photos || !m.row.photos[i]) return;
  if (m.type === 'incident') { const r = grabInc(); if (crop) r.photos[i].crop = crop; else delete r.photos[i].crop; m.keepScroll = true;
    (r._new ? Promise.resolve() : save('incidents', clean(r))).then(() => { renderModal(); toast(crop ? 'Report framing saved' : 'Reports will show the whole photo'); }); return; }
  grab(); if (crop) m.row.photos[i].crop = crop; else delete m.row.photos[i].crop; m.keepScroll = true;
  commitSub().then(() => { renderModal(); toast(crop ? 'Report framing saved' : 'Reports will show the whole photo'); });
}
Object.assign(ACT, {
  zoom(d) {
    const ps = (S.modal && S.modal.row && S.modal.row.photos) || []; const i = +d.i, p = ps[i]; if (!p) return;
    const lb = $('#lightbox'); const close = () => { lb.innerHTML = ''; };
    const show = () => {
      lb.innerHTML = `<div class="lightbox pz"><div class="pz-top"><span class="pz-n">Photo ${i + 1} of ${ps.length}${p.crop ? ' · framed for reports' : ''}</span><span style="flex:1"></span>
        ${ps.length > 1 ? '<button class="pz-b" data-pz="prev" aria-label="Previous photo">‹</button><button class="pz-b" data-pz="next" aria-label="Next photo">›</button>' : ''}<button class="pz-b" data-pz="close" aria-label="Close">×</button></div>
        <img src="${esc(p.url)}" alt="" class="pz-img">
        <div class="pz-bar"><button class="btn pri" data-pz="frame">✂ Choose what shows in reports</button>${p.crop ? '<button class="btn" data-pz="whole">Show the whole photo</button>' : ''}<a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">Open full size ↗</a></div></div>`;
    };
    const frame = () => {
      const img = new Image();
      img.onload = () => {
        const A = 4 / 3, W = Math.min(620, window.innerWidth - 56), H = Math.round(W / A), ar = img.width / img.height;
        const base = Math.max(W / img.width, H / img.height); let z = 1, x = 0, y = 0;
        if (p.crop && p.crop.cw) { z = (W / (p.crop.cw * img.width)) / base; z = Math.min(5, Math.max(1, z)); const s = base * z; x = (0.5 - p.crop.cx) * img.width * s; y = (0.5 - p.crop.cy) * img.height * s; }
        lb.innerHTML = `<div class="lightbox pz"><div class="pcard"><h3 style="margin:0 0 4px">Choose what shows in reports</h3><div class="tiny muted" style="margin-bottom:10px">Drag the photo and zoom so the important part is inside the frame. The photo itself isn’t changed — this only sets what prints.</div>
          <div class="pfr" style="width:${W}px;height:${H}px"><img src="${esc(p.url)}" alt="" draggable="false"></div>
          <div class="row" style="gap:8px;align-items:center;margin-top:12px"><span aria-hidden="true">➖</span><input type="range" min="1" max="5" step="0.01" aria-label="Zoom" style="flex:1"><span aria-hidden="true">➕</span></div>
          <div class="row" style="gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn sm ghost" data-pz="reset">Reset</button><span style="flex:1"></span><button class="btn" data-pz="back">Cancel</button><button class="btn pri" data-pz="save">Save framing</button></div></div></div>`;
        const box = lb.querySelector('.pfr'), im = box.querySelector('img'), rng = lb.querySelector('input[type=range]');
        const clamp = () => { const w = img.width * base * z, h = img.height * base * z, mx = (w - W) / 2, my = (h - H) / 2; x = Math.min(mx, Math.max(-mx, x)); y = Math.min(my, Math.max(-my, y)); };
        const draw = () => { clamp(); const w = img.width * base * z, h = img.height * base * z; Object.assign(im.style, {width: w + 'px', height: h + 'px', left: (W - w) / 2 + x + 'px', top: (H - h) / 2 + y + 'px'}); rng.value = z; };
        const zoomTo = nz => { nz = Math.min(5, Math.max(1, nz)); x *= nz / z; y *= nz / z; z = nz; draw(); };
        draw(); rng.addEventListener('input', () => zoomTo(+rng.value));
        box.addEventListener('wheel', e => { e.preventDefault(); zoomTo(z * (e.deltaY < 0 ? 1.08 : 1 / 1.08)); }, {passive: false});
        const pts = new Map(); let last = null, pinch = null;
        box.addEventListener('pointerdown', e => { box.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x: e.clientX, y: e.clientY}); last = {x: e.clientX, y: e.clientY}; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = {d: Math.hypot(a.x - b.x, a.y - b.y), z}; } });
        box.addEventListener('pointermove', e => { if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
          if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()]; zoomTo(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d); return; }
          if (last) { x += e.clientX - last.x; y += e.clientY - last.y; last = {x: e.clientX, y: e.clientY}; draw(); } });
        const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; const r = [...pts.values()][0]; last = r ? {x: r.x, y: r.y} : null; };
        box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
        lb.querySelector('.pcard').addEventListener('click', e => { const b = e.target.closest('[data-pz]'); if (!b) return; e.stopPropagation();
          if (b.dataset.pz === 'reset') { z = 1; x = y = 0; draw(); }
          else if (b.dataset.pz === 'back') show();
          else if (b.dataset.pz === 'save') { const s = base * z; const crop = {cx: +(0.5 - x / (img.width * s)).toFixed(4), cy: +(0.5 - y / (img.height * s)).toFixed(4), cw: +(W / (img.width * s)).toFixed(4), ar: +ar.toFixed(4)}; close(); facPhotoSaveCrop(i, crop); } });
      };
      img.onerror = () => toast('That photo couldn’t be loaded');
      img.src = p.url;
    };
    show();
    lb.onclick = e => { const b = e.target.closest('[data-pz]');
      if (!b) { if (e.target.classList.contains('lightbox')) close(); return; }
      const a = b.dataset.pz;
      if (a === 'close') close(); else if (a === 'next') ACT.zoom({i: (i + 1) % ps.length}); else if (a === 'prev') ACT.zoom({i: (i - 1 + ps.length) % ps.length});
      else if (a === 'frame') frame(); else if (a === 'whole') { close(); facPhotoSaveCrop(i, null); } };
  },
});
